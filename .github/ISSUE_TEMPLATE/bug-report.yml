name: Bug Report
description: Report a bug or unexpected behavior
title: "fix: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide enough detail to reproduce and investigate it.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug
      placeholder: Describe what happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe the expected behavior
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Run '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the app version or commit, browser, operating system, and deployment environment.
      placeholder: |
        - Version or commit: ...
        - Browser: ...
        - Operating system: ...
        - Environment: local / test / production
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots
      description: Add relevant logs or screenshots. Remove passwords, tokens, keys, and other sensitive data first.
      placeholder: Paste redacted logs or drag screenshots here
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context that may help diagnose the problem.
      placeholder: Share related changes, frequency, workarounds, or other details
    validations:
      required: false
