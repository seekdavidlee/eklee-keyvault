name: CI/CD

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'Deployment/**'
      - '**.md'

permissions:
  id-token: write
  contents: read
  packages: write
  pull-requests: read

jobs:
  setup:
    name: Resolve Container App Name
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - id: setup
        name: Resolve Container App Name
        env:
          DEV_CONTAINER_APP_NAME: ${{ vars.DEV_CONTAINER_APP_NAME }}
          DEV_E2E_BASE_URL: ${{ vars.DEV_E2E_BASE_URL }}
          RELEASE_CONTAINER_APP_NAME: ${{ vars.RELEASE_CONTAINER_APP_NAME }}
          RELEASE_E2E_BASE_URL: ${{ vars.RELEASE_E2E_BASE_URL }}
        run: |
          set -euo pipefail
          container_app_name=$(BRANCH_NAME="${GITHUB_REF_NAME}" bash .github/scripts/resolve-container-app-name.sh)
          echo "container_app_name=$container_app_name" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            : "${DEV_E2E_BASE_URL:?DEV_E2E_BASE_URL is required for main deployments}"
            echo "target=main" >> "$GITHUB_OUTPUT"
            echo "base_url=${DEV_E2E_BASE_URL}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == release/* ]]; then
            : "${RELEASE_E2E_BASE_URL:?RELEASE_E2E_BASE_URL is required for release deployments}"
            echo "target=release" >> "$GITHUB_OUTPUT"
            echo "base_url=${RELEASE_E2E_BASE_URL}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unsupported permanent deployment ref '${GITHUB_REF_NAME}'."
            exit 1
          fi
    outputs:
      container_app_name: ${{ steps.setup.outputs.container_app_name }}
      target: ${{ steps.setup.outputs.target }}
      base_url: ${{ steps.setup.outputs.base_url }}

  test-dotnet:
    name: Test .NET Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore Eklee.KeyVault.sln

      - name: Build solution
        run: dotnet build Eklee.KeyVault.sln --no-restore --configuration Release

      - name: Run .NET tests
        run: dotnet test Eklee.KeyVault.sln --no-restore --no-build --configuration Release

  test-npm:
    name: Test npm Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Eklee.KeyVault.UI/package-lock.json

      - name: Install dependencies
        working-directory: Eklee.KeyVault.UI
        run: npm ci

      - name: Lint UI
        working-directory: Eklee.KeyVault.UI
        run: npm run lint

      - name: Build UI
        working-directory: Eklee.KeyVault.UI
        run: npm run build

  build-and-push:
    name: Build and Push Docker Image
    needs: [test-dotnet, test-npm]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image-digest.outputs.image }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: image-tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REF_NAME="${GITHUB_REF_NAME}"
          TAG=$(REF_NAME="$REF_NAME" bash .github/scripts/resolve-image-tag.sh)
          COMMIT_TAG="sha-${GITHUB_SHA}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "repository=ghcr.io/${{ github.repository }}" >> $GITHUB_OUTPUT
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT
          echo "commit_tag=$COMMIT_TAG" >> $GITHUB_OUTPUT

          if [[ "$REF_NAME" =~ ^release/((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            merged_pr_number=$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq ".[] | select(.merged_at != null and .base.ref == \"$REF_NAME\" and .merge_commit_sha == \"$GITHUB_SHA\") | .number" \
              | head -n 1)

            if [[ -n "$merged_pr_number" ]]; then
              echo "release_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
              echo "source_revision_id=${GITHUB_SHA}" >> $GITHUB_OUTPUT
            else
              echo "Release branch push is not an associated merged pull request; omitting stable release metadata."
            fi
          fi

      - name: Build Docker image
        env:
          RELEASE_VERSION: ${{ steps.image-tag.outputs.release_version }}
          SOURCE_REVISION_ID: ${{ steps.image-tag.outputs.source_revision_id }}
        run: |
          build_args=()
          if [[ -n "$RELEASE_VERSION" && -n "$SOURCE_REVISION_ID" ]]; then
            build_args+=(--build-arg "RELEASE_VERSION=$RELEASE_VERSION")
            build_args+=(--build-arg "SOURCE_REVISION_ID=$SOURCE_REVISION_ID")
          fi

          docker build "${build_args[@]}" -t ${{ steps.image-tag.outputs.repository }}:${{ steps.image-tag.outputs.image_tag }} \
            --target runtime \
            .

      - name: Push Docker image to GHCR
        id: image-digest
        run: |
          docker push ${{ steps.image-tag.outputs.repository }}:${{ steps.image-tag.outputs.image_tag }}
          docker tag ${{ steps.image-tag.outputs.repository }}:${{ steps.image-tag.outputs.image_tag }} \
            ${{ steps.image-tag.outputs.repository }}:${{ steps.image-tag.outputs.commit_tag }}
          docker push ${{ steps.image-tag.outputs.repository }}:${{ steps.image-tag.outputs.commit_tag }}
          digest=$(docker buildx imagetools inspect \
            ${{ steps.image-tag.outputs.repository }}:${{ steps.image-tag.outputs.commit_tag }} \
              --format '{{.Manifest.Digest}}')
          echo "image=${{ steps.image-tag.outputs.repository }}@$digest" >> "$GITHUB_OUTPUT"

      - name: Tag and push additional tags
        if: github.ref == 'refs/heads/main'
        run: |
          # Retain an immutable companion tag for the mutable latest tag.
          docker tag ${{ steps.image-tag.outputs.image }} \
            ghcr.io/${{ github.repository }}:${GITHUB_SHA::8}
          docker push ghcr.io/${{ github.repository }}:${GITHUB_SHA::8}

      - name: Output image details
        run: |
          echo "✅ Successfully built and pushed image:"
          echo "   ${{ steps.image-tag.outputs.image }}"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "   ghcr.io/${{ github.repository }}:${GITHUB_SHA::8}"
          fi

  deploy:
    name: Deploy to Azure Container Apps
    needs: [setup, build-and-push]
    if: ${{ !failure() && !cancelled() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: permanent-container-app-${{ needs.setup.outputs.target }}
      queue: max
    outputs:
      fqdn: ${{ steps.deploy-app.outputs.fqdn }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Container App
        id: deploy-app
        run: |
          RESOURCE_GROUP="${{ vars.RESOURCE_GROUP }}"
          IMAGE="${{ needs.build-and-push.outputs.image }}"
          CONTAINER_APP_NAME="${{ needs.setup.outputs.container_app_name }}"
          TARGET_BASE_URL="${{ needs.setup.outputs.base_url }}"

          # Discover infrastructure resources from the resource group
          ENV_NAME=$(az containerapp env list --resource-group "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          IDENTITY_ID=$(az identity list --resource-group "$RESOURCE_GROUP" --query "[0].id" -o tsv)
          IDENTITY_CLIENT_ID=$(az identity list --resource-group "$RESOURCE_GROUP" --query "[0].clientId" -o tsv)
          KEYVAULT_URI=$(az keyvault list --resource-group "$RESOURCE_GROUP" --query "[0].properties.vaultUri" -o tsv)
          STORAGE_BLOB_URI=$(az storage account list --resource-group "$RESOURCE_GROUP" --query "[0].primaryEndpoints.blob" -o tsv)

          # Detect VNET integration status for operational visibility
          # When the Container Apps Environment is VNET-integrated, the Container App
          # resolves Key Vault and Storage URLs to private IPs via private DNS zones.
          VNET_SUBNET_ID=$(az containerapp env show --name "$ENV_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "properties.vnetConfiguration.infrastructureSubnetId" -o tsv 2>/dev/null || echo "")

          echo "Container Apps Environment: $ENV_NAME"
          echo "Managed Identity: $IDENTITY_ID"
          echo "Managed Identity Client ID: $IDENTITY_CLIENT_ID"
          echo "Key Vault URI: $KEYVAULT_URI"
          echo "Storage Blob URI: $STORAGE_BLOB_URI"
          if [ -n "$VNET_SUBNET_ID" ] && [ "$VNET_SUBNET_ID" != "None" ]; then
            echo "🔒 Private networking: ENABLED (VNET-integrated)"
            echo "   Infrastructure subnet: $VNET_SUBNET_ID"
          else
            echo "🌐 Private networking: DISABLED (public access)"
          fi

          # Check if container app already exists
          EXISTS=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "name" -o tsv 2>/dev/null || echo "")

          if [ -z "$EXISTS" ]; then
            echo "::error::Permanent Container App '$CONTAINER_APP_NAME' is missing. Run maintainer provisioning before CI deployment."
            exit 1
          fi

          if [[ "$IMAGE" != *@sha256:* ]]; then
            echo "::error::Expected an immutable container image digest, received '$IMAGE'."
            exit 1
          fi

          echo "Updating permanent Container App '$CONTAINER_APP_NAME'..."
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --min-replicas 1 \
            --max-replicas 1 \
            --set-env-vars \
              AZURE_CLIENT_ID="$IDENTITY_CLIENT_ID" \
              StorageUri="$STORAGE_BLOB_URI" \
              StorageContainerName=configs \
              KeyVaultUri="$KEYVAULT_URI" \
              AuthenticationMode=mi \
              AzureAd__Instance=https://login.microsoftonline.com/ \
              AzureAd__TenantId=${{ vars.AZURE_TENANT_ID }} \
              AzureAd__ClientId=${{ vars.VITE_AZURE_AD_CLIENT_ID }} \
              AzureAd__Audience=api://${{ vars.VITE_AZURE_AD_CLIENT_ID }} \
              VITE_AZURE_AD_CLIENT_ID=${{ vars.VITE_AZURE_AD_CLIENT_ID }} \
              VITE_AZURE_AD_AUTHORITY=${{ vars.VITE_AZURE_AD_AUTHORITY }} \
              VITE_AZURE_AD_REDIRECT_URI="$TARGET_BASE_URL" \
              VITE_API_BASE_URL="$TARGET_BASE_URL"

          # Display deployed app URL
          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "✅ Container app deployed successfully: https://$FQDN"
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"

      - name: Wait for permanent target
        env:
          BASE_URL: ${{ needs.setup.outputs.base_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$BASE_URL/healthz" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Container App did not become healthy: $BASE_URL"
          exit 1

      - name: Get hosted E2E access token
        id: token
        run: |
          set -euo pipefail
          token=$(az account get-access-token --scope "api://${{ vars.VITE_AZURE_AD_CLIENT_ID }}/.default" --query accessToken --output tsv)
          echo "::add-mask::$token"
          echo "access_token=$token" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Eklee.KeyVault.UI/package-lock.json

      - name: Run hosted Playwright tests
        working-directory: Eklee.KeyVault.UI
        env:
          E2E_BASE_URL: ${{ needs.setup.outputs.base_url }}
          E2E_CLIENT_ID: ${{ vars.VITE_AZURE_AD_CLIENT_ID }}
          E2E_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          E2E_ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-playwright-results-${{ needs.setup.outputs.target }}-${{ github.run_id }}
          path: |
            Eklee.KeyVault.UI/playwright-report/
            Eklee.KeyVault.UI/test-results/
          retention-days: 7
