name: CI/CD

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'Deployment/**'
      - '**.md'

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  setup:
    name: Choose Secrets Environment
    runs-on: ubuntu-latest
    steps:
      - id: setup
        name: Setup Environment
        # main branch uses prod; all other branches use dev
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "build_env=prod" >> $GITHUB_OUTPUT
          else
            echo "build_env=dev" >> $GITHUB_OUTPUT
          fi
    outputs:
      build_env: ${{ steps.setup.outputs.build_env }}

  test-dotnet:
    name: Test .NET Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore Eklee.KeyVault.Api/Eklee.KeyVault.Api.csproj

      - name: Build API
        run: dotnet build Eklee.KeyVault.Api/Eklee.KeyVault.Api.csproj --no-restore --configuration Release

  test-npm:
    name: Test npm Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Eklee.KeyVault.UI/package-lock.json

      - name: Install dependencies
        working-directory: Eklee.KeyVault.UI
        run: npm ci

      - name: Build UI
        working-directory: Eklee.KeyVault.UI
        run: npm run build

  e2e-test:
    name: Playwright E2E Tests
    needs: [setup, test-dotnet, test-npm]
    if: needs.setup.outputs.build_env == 'dev'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Eklee.KeyVault.UI/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install UI dependencies
        working-directory: Eklee.KeyVault.UI
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Eklee.KeyVault.UI
        run: npx playwright install --with-deps chromium

      - name: Build UI
        working-directory: Eklee.KeyVault.UI
        run: npm run build

      - name: Publish API
        run: dotnet publish Eklee.KeyVault.Api/Eklee.KeyVault.Api.csproj -c Release -o ./publish

      - name: Copy UI build to API wwwroot
        run: |
          mkdir -p ./publish/wwwroot
          if [ ! -d "Eklee.KeyVault.UI/dist" ]; then
            echo "UI build output directory 'Eklee.KeyVault.UI/dist' does not exist."
            exit 1
          fi
          cp -r Eklee.KeyVault.UI/dist/. ./publish/wwwroot/

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate required environment variables
        run: |
          missing=()
          [[ -z "${{ vars.E2E_KEYVAULT_URI }}" ]] && missing+=("E2E_KEYVAULT_URI")
          [[ -z "${{ vars.E2E_STORAGE_URI }}" ]] && missing+=("E2E_STORAGE_URI")
          [[ -z "${{ vars.VITE_AZURE_AD_CLIENT_ID }}" ]] && missing+=("VITE_AZURE_AD_CLIENT_ID")
          [[ -z "${{ vars.AZURE_TENANT_ID }}" ]] && missing+=("AZURE_TENANT_ID")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required environment variables: ${missing[*]}"
            echo "Set these in GitHub Settings → Environments → dev → Variables"
            exit 1
          fi

      - name: Resolve resource names from URIs
        id: resources
        run: |
          # Extract Key Vault name from URI (e.g. https://myvault.vault.azure.net/)
          KV_NAME=$(echo "${{ vars.E2E_KEYVAULT_URI }}" | sed -E 's|https://([^.]+)\.vault\.azure\.net/?|\1|')
          echo "kv_name=$KV_NAME" >> "$GITHUB_OUTPUT"

          # Extract Storage Account name from URI (e.g. https://myaccount.blob.core.windows.net/)
          SA_NAME=$(echo "${{ vars.E2E_STORAGE_URI }}" | sed -E 's|https://([^.]+)\.blob\.core\.windows\.net/?|\1|')
          echo "sa_name=$SA_NAME" >> "$GITHUB_OUTPUT"

          echo "Key Vault name: $KV_NAME"
          echo "Storage Account name: $SA_NAME"

      - name: Verify RBAC for CI identity
        run: |
          set -euo pipefail

          # Resolve the service principal object ID for the federated identity
          SP_OBJECT_ID=$(az ad sp show --id "${{ vars.AZURE_CLIENT_ID }}" --query id -o tsv)
          echo "Service Principal Object ID: $SP_OBJECT_ID"

          ERRORS=()

          # --- Key Vault RBAC check ---
          KV_RESOURCE_ID=$(az keyvault show --name "${{ steps.resources.outputs.kv_name }}" --query id -o tsv)
          KV_ROLES=$(az role assignment list --assignee "$SP_OBJECT_ID" --scope "$KV_RESOURCE_ID" --output json)
          REQUIRED_KV_ROLE="Key Vault Secrets Officer"
          HAS_KV_ROLE=$(echo "$KV_ROLES" | jq -r --arg role "$REQUIRED_KV_ROLE" '[.[] | select(.roleDefinitionName == $role)] | length')

          if [[ "$HAS_KV_ROLE" -gt 0 ]]; then
            echo "✅ CI identity has '$REQUIRED_KV_ROLE' on Key Vault '${{ steps.resources.outputs.kv_name }}'."
          else
            ASSIGNED=$(echo "$KV_ROLES" | jq -r '[.[].roleDefinitionName] | join(", ")')
            echo "::error::CI identity does NOT have '$REQUIRED_KV_ROLE' on Key Vault '${{ steps.resources.outputs.kv_name }}'. Assigned roles: ${ASSIGNED:-none}"
            echo "Fix: az role assignment create --assignee $SP_OBJECT_ID --role '$REQUIRED_KV_ROLE' --scope $KV_RESOURCE_ID"
            ERRORS+=("Missing $REQUIRED_KV_ROLE on Key Vault")
          fi

          # --- Storage Account RBAC check ---
          SA_RESOURCE_ID=$(az storage account show --name "${{ steps.resources.outputs.sa_name }}" --query id -o tsv)
          SA_ROLES=$(az role assignment list --assignee "$SP_OBJECT_ID" --scope "$SA_RESOURCE_ID" --output json)
          REQUIRED_SA_ROLE="Storage Blob Data Contributor"
          HAS_SA_ROLE=$(echo "$SA_ROLES" | jq -r --arg role "$REQUIRED_SA_ROLE" '[.[] | select(.roleDefinitionName == $role)] | length')

          if [[ "$HAS_SA_ROLE" -gt 0 ]]; then
            echo "✅ CI identity has '$REQUIRED_SA_ROLE' on Storage Account '${{ steps.resources.outputs.sa_name }}'."
          else
            ASSIGNED=$(echo "$SA_ROLES" | jq -r '[.[].roleDefinitionName] | join(", ")')
            echo "::error::CI identity does NOT have '$REQUIRED_SA_ROLE' on Storage Account '${{ steps.resources.outputs.sa_name }}'. Assigned roles: ${ASSIGNED:-none}"
            echo "Fix: az role assignment create --assignee $SP_OBJECT_ID --role '$REQUIRED_SA_ROLE' --scope $SA_RESOURCE_ID"
            ERRORS+=("Missing $REQUIRED_SA_ROLE on Storage Account")
          fi

          if [[ ${#ERRORS[@]} -gt 0 ]]; then
            echo "::error::RBAC check failed. Grant the required roles to the CI service principal (${{ vars.AZURE_CLIENT_ID }})."
            exit 1
          fi

      - name: Enable public network access for E2E tests
        id: enable-public-access
        run: |
          set -euo pipefail
          echo "Temporarily enabling public network access..."

          az keyvault update \
            --name "${{ steps.resources.outputs.kv_name }}" \
            --public-network-access Enabled \
            --output none
          echo "✅ Key Vault '${{ steps.resources.outputs.kv_name }}' public access enabled."

          az storage account update \
            --name "${{ steps.resources.outputs.sa_name }}" \
            --public-network-access Enabled \
            --output none
          echo "✅ Storage Account '${{ steps.resources.outputs.sa_name }}' public access enabled."

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Get access token for E2E tests
        id: token
        run: |
          TOKEN=$(az account get-access-token \
            --resource "${{ vars.VITE_AZURE_AD_CLIENT_ID }}" \
            --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "access_token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Start application
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:8080
          AzureAd__Instance: https://login.microsoftonline.com/
          AzureAd__TenantId: ${{ vars.AZURE_TENANT_ID }}
          AzureAd__ClientId: ${{ vars.VITE_AZURE_AD_CLIENT_ID }}
          KeyVaultUri: ${{ vars.E2E_KEYVAULT_URI }}
          StorageUri: ${{ vars.E2E_STORAGE_URI }}
          StorageContainerName: configs
          AuthenticationMode: azcli
          ALLOW_ACL_AUTH: "true"
        run: |
          cd publish
          # Generate runtime config for the SPA
          cat > wwwroot/config.js <<EOF
          window.__RUNTIME_CONFIG__ = {
            AZURE_AD_CLIENT_ID: "${{ vars.VITE_AZURE_AD_CLIENT_ID }}",
            AZURE_AD_AUTHORITY: "${{ vars.VITE_AZURE_AD_AUTHORITY }}",
            AZURE_AD_REDIRECT_URI: "http://localhost:8080",
            API_BASE_URL: ""
          };
          EOF
          nohup dotnet Eklee.KeyVault.Api.dll > /tmp/app.log 2>&1 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for application to be ready
        run: |
          echo "Waiting for app on http://localhost:8080/healthz..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz > /dev/null 2>&1; then
              echo "App is ready!"
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start. Logs:"
          cat /tmp/app.log
          exit 1

      - name: Run Playwright tests
        working-directory: Eklee.KeyVault.UI
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_CLIENT_ID: ${{ vars.VITE_AZURE_AD_CLIENT_ID }}
          E2E_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          E2E_ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
        run: npx playwright test

      - name: Upload Playwright results and server logs
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-results
          path: |
            Eklee.KeyVault.UI/playwright-report/
            Eklee.KeyVault.UI/test-results/
            /tmp/app.log
          retention-days: 7

      - name: Disable public network access
        if: always() && steps.enable-public-access.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          echo "Restoring private network access..."

          az keyvault update \
            --name "${{ steps.resources.outputs.kv_name }}" \
            --public-network-access Disabled \
            --output none
          echo "✅ Key Vault '${{ steps.resources.outputs.kv_name }}' public access disabled."

          az storage account update \
            --name "${{ steps.resources.outputs.sa_name }}" \
            --public-network-access Disabled \
            --output none
          echo "✅ Storage Account '${{ steps.resources.outputs.sa_name }}' public access disabled."

  build-and-push:
    name: Build and Push Docker Image
    needs: [setup, test-dotnet, test-npm, e2e-test]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.build_env }}
    outputs:
      image: ${{ steps.image-tag.outputs.image }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Set image tag
        id: image-tag
        run: |
          # Use short SHA for dev, release tag for main
          if [[ "${{ needs.setup.outputs.build_env }}" == "prod" ]]; then
            TAG="latest"
          else
            TAG="dev-${GITHUB_SHA::8}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "image=${{ vars.ACR_NAME }}.azurecr.io/eklee-keyvault:$TAG" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.image-tag.outputs.image }} \
            --target runtime \
            .

      - name: Push Docker image to ACR
        run: |
          docker push ${{ steps.image-tag.outputs.image }}

      - name: Tag and push additional tags
        if: needs.setup.outputs.build_env == 'prod'
        run: |
          # For production, also tag with the commit SHA
          docker tag ${{ steps.image-tag.outputs.image }} \
            ${{ vars.ACR_NAME }}.azurecr.io/eklee-keyvault:${GITHUB_SHA::8}
          docker push ${{ vars.ACR_NAME }}.azurecr.io/eklee-keyvault:${GITHUB_SHA::8}

      - name: Output image details
        run: |
          echo "✅ Successfully built and pushed image:"
          echo "   ${{ steps.image-tag.outputs.image }}"
          if [[ "${{ needs.setup.outputs.build_env }}" == "prod" ]]; then
            echo "   ${{ vars.ACR_NAME }}.azurecr.io/eklee-keyvault:${GITHUB_SHA::8}"
          fi

  push-ghcr:
    name: Push to GitHub Container Registry
    needs: [setup, test-dotnet, test-npm, e2e-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.build_env }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:latest"
          IMAGE_SHA="ghcr.io/${{ github.repository }}:${GITHUB_SHA::8}"

          docker build -t "$IMAGE" -t "$IMAGE_SHA" \
            --target runtime \
            .

          docker push "$IMAGE"
          docker push "$IMAGE_SHA"
          echo "✅ Pushed public image to GHCR:"
          echo "   $IMAGE"
          echo "   $IMAGE_SHA"

  deploy:
    name: Deploy to Azure Container Apps
    needs: [setup, build-and-push]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.build_env }}

    steps:
      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Container App
        run: |
          RESOURCE_GROUP="${{ vars.RESOURCE_GROUP }}"
          IMAGE="${{ needs.build-and-push.outputs.image }}"
          ACR_SERVER="${{ vars.ACR_NAME }}.azurecr.io"
          CONTAINER_APP_NAME="eklee-keyvault"

          # Discover infrastructure resources from the resource group
          ENV_NAME=$(az containerapp env list --resource-group "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          IDENTITY_ID=$(az identity list --resource-group "$RESOURCE_GROUP" --query "[0].id" -o tsv)
          IDENTITY_CLIENT_ID=$(az identity list --resource-group "$RESOURCE_GROUP" --query "[0].clientId" -o tsv)
          KEYVAULT_URI=$(az keyvault list --resource-group "$RESOURCE_GROUP" --query "[0].properties.vaultUri" -o tsv)
          STORAGE_BLOB_URI=$(az storage account list --resource-group "$RESOURCE_GROUP" --query "[0].primaryEndpoints.blob" -o tsv)

          # Detect VNET integration status for operational visibility
          # When the Container Apps Environment is VNET-integrated, the Container App
          # resolves Key Vault and Storage URLs to private IPs via private DNS zones.
          VNET_SUBNET_ID=$(az containerapp env show --name "$ENV_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "properties.vnetConfiguration.infrastructureSubnetId" -o tsv 2>/dev/null || echo "")

          echo "Container Apps Environment: $ENV_NAME"
          echo "Managed Identity: $IDENTITY_ID"
          echo "Managed Identity Client ID: $IDENTITY_CLIENT_ID"
          echo "Key Vault URI: $KEYVAULT_URI"
          echo "Storage Blob URI: $STORAGE_BLOB_URI"
          if [ -n "$VNET_SUBNET_ID" ] && [ "$VNET_SUBNET_ID" != "None" ]; then
            echo "🔒 Private networking: ENABLED (VNET-integrated)"
            echo "   Infrastructure subnet: $VNET_SUBNET_ID"
          else
            echo "🌐 Private networking: DISABLED (public access)"
          fi

          # Check if container app already exists
          EXISTS=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "name" -o tsv 2>/dev/null || echo "")

          if [ -z "$EXISTS" ]; then
            echo "Creating container app '$CONTAINER_APP_NAME'..."
            az containerapp create \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$ENV_NAME" \
              --image "$IMAGE" \
              --target-port 8080 \
              --ingress external \
              --user-assigned "$IDENTITY_ID" \
              --registry-server "$ACR_SERVER" \
              --registry-identity "$IDENTITY_ID" \
              --cpu 0.5 \
              --memory 1.0Gi \
              --min-replicas 0 \
              --max-replicas 1 \
              --env-vars \
                AZURE_CLIENT_ID="$IDENTITY_CLIENT_ID" \
                StorageUri="$STORAGE_BLOB_URI" \
                StorageContainerName=configs \
                KeyVaultUri="$KEYVAULT_URI" \
                AuthenticationMode=mi \
                AzureAd__Instance=https://login.microsoftonline.com/ \
                AzureAd__TenantId=${{ vars.AZURE_TENANT_ID }} \
                AzureAd__ClientId=${{ vars.VITE_AZURE_AD_CLIENT_ID }} \
                AzureAd__Audience=api://${{ vars.VITE_AZURE_AD_CLIENT_ID }} \
                VITE_AZURE_AD_CLIENT_ID=${{ vars.VITE_AZURE_AD_CLIENT_ID }} \
                VITE_AZURE_AD_AUTHORITY=${{ vars.VITE_AZURE_AD_AUTHORITY }} \
                VITE_AZURE_AD_REDIRECT_URI=${{ vars.VITE_AZURE_AD_REDIRECT_URI }}
          else
            echo "Updating container app '$CONTAINER_APP_NAME'..."
            az containerapp update \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE" \
              --min-replicas 0 \
              --max-replicas 1 \
              --set-env-vars \
                AZURE_CLIENT_ID="$IDENTITY_CLIENT_ID" \
                StorageUri="$STORAGE_BLOB_URI" \
                StorageContainerName=configs \
                KeyVaultUri="$KEYVAULT_URI" \
                AuthenticationMode=mi \
                AzureAd__Instance=https://login.microsoftonline.com/ \
                AzureAd__TenantId=${{ vars.AZURE_TENANT_ID }} \
                AzureAd__ClientId=${{ vars.VITE_AZURE_AD_CLIENT_ID }} \
                AzureAd__Audience=api://${{ vars.VITE_AZURE_AD_CLIENT_ID }} \
                VITE_AZURE_AD_CLIENT_ID=${{ vars.VITE_AZURE_AD_CLIENT_ID }} \
                VITE_AZURE_AD_AUTHORITY=${{ vars.VITE_AZURE_AD_AUTHORITY }} \
                VITE_AZURE_AD_REDIRECT_URI=${{ vars.VITE_AZURE_AD_REDIRECT_URI }}
          fi

          # Display deployed app URL
          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "✅ Container app deployed successfully: https://$FQDN"
