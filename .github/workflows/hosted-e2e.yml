name: Hosted Playwright E2E

on:
  workflow_run:
    workflows: ['CI/CD']
    types: [completed]
    branches:
      - 'release/**'
  pull_request:
    branches:
      - main
    types: [closed]

permissions:
  id-token: write
  contents: read

concurrency:
  group: hosted-e2e-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Run hosted Playwright tests
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}

      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve target Container App
        id: target
        env:
          BRANCH_NAME: ${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
        run: |
          set -euo pipefail

          if [[ "$BRANCH_NAME" == "main" ]]; then
            echo "::error::Hosted E2E must target a branch or release Container App, not main."
            exit 1
          fi

          container_app_name=$(bash .github/scripts/resolve-container-app-name.sh)
          fqdn=$(az containerapp show \
            --name "$container_app_name" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          if [[ -z "$fqdn" || "$fqdn" == "None" ]]; then
            echo "::error::Container App '$container_app_name' has no external ingress FQDN."
            exit 1
          fi

          echo "container_app_name=$container_app_name" >> "$GITHUB_OUTPUT"
          echo "base_url=https://$fqdn" >> "$GITHUB_OUTPUT"

      - name: Wait for Container App
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$BASE_URL/healthz" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Container App did not become healthy: $BASE_URL"
          exit 1

      - name: Get hosted E2E access token
        id: token
        run: |
          set -euo pipefail
          token=$(az account get-access-token \
            --scope "api://${{ vars.VITE_AZURE_AD_CLIENT_ID }}/.default" \
            --query accessToken \
            --output tsv)
          echo "::add-mask::$token"
          echo "access_token=$token" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Eklee.KeyVault.UI/package-lock.json

      - name: Install UI dependencies
        working-directory: Eklee.KeyVault.UI
        run: npm ci

      - name: Install Playwright browser
        working-directory: Eklee.KeyVault.UI
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: Eklee.KeyVault.UI
        env:
          E2E_BASE_URL: ${{ steps.target.outputs.base_url }}
          E2E_CLIENT_ID: ${{ vars.VITE_AZURE_AD_CLIENT_ID }}
          E2E_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          E2E_ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
        run: npx playwright test

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-playwright-results
          path: |
            Eklee.KeyVault.UI/playwright-report/
            Eklee.KeyVault.UI/test-results/
          retention-days: 7

  publish-release:
    name: Publish semantic release image
    needs: playwright
    if: >-
      needs.playwright.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout merged release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Publish immutable release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_BRANCH" =~ ^release/((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            echo "::error::Release branch '$RELEASE_BRANCH' must use release/MAJOR.MINOR.PATCH."
            exit 1
          fi

          version="${BASH_REMATCH[1]}"

          if ! git merge-base --is-ancestor "$MERGE_SHA" origin/main; then
            echo "::error::Release merge commit '$MERGE_SHA' is not reachable from origin/main."
            exit 1
          fi

          tag_exists=false
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            tag_exists=true
            git fetch --no-tags origin "refs/tags/$version:refs/tags/$version"
            tag_commit=$(git rev-parse "$version^{commit}")
            if [[ "$tag_commit" != "$MERGE_SHA" ]]; then
              echo "::error::Existing tag '$version' identifies '$tag_commit', not '$MERGE_SHA'."
              exit 1
            fi
          fi

          gh release view "$version" --json targetCommitish >/dev/null 2>&1 && release_exists=true || release_exists=false
          if [[ "$release_exists" == true ]]; then
            release_target=$(gh release view "$version" --json targetCommitish --jq .targetCommitish)
            if [[ "$release_target" != "$MERGE_SHA" ]]; then
              echo "::error::Existing GitHub Release '$version' identifies '$release_target', not '$MERGE_SHA'."
              exit 1
            fi
          fi

          docker login ghcr.io --username "$GITHUB_ACTOR" --password "$GH_TOKEN"
          docker manifest inspect "$IMAGE:$version" >/dev/null 2>&1 && image_exists=true || image_exists=false

          if [[ "$tag_exists" == false && ( "$release_exists" == true || "$image_exists" == true ) ]]; then
            echo "::error::Release artifacts exist for '$version' without its Git tag. Refusing to overwrite or adopt them."
            exit 1
          fi

          if [[ "$tag_exists" == false ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$version" "$MERGE_SHA" --message "Release $version"
            git push origin "refs/tags/$version"
          fi

          if [[ "$image_exists" == false ]]; then
            docker build --target runtime --tag "$IMAGE:$version" .
            docker push "$IMAGE:$version"
          fi

          if [[ "$release_exists" == false ]]; then
            gh release create "$version" --target "$MERGE_SHA" --title "$version" --generate-notes
          fi

  cleanup-release:
    name: Clean up release Container App and image
    needs: [playwright, publish-release]
    if: >-
      needs.playwright.result == 'success' &&
      needs.publish-release.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/cleanup-container-app.yml
    with:
      cleanup_release: true