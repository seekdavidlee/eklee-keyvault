# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: eklee-keyvault

metadata:
  template: eklee-keyvault

infra:
  provider: bicep
  path: Deployment
  module: azd

hooks:
  preprovision:
    shell: pwsh
    run: pwsh -NoProfile -File ./Deployment/resolve-resource-names.ps1; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; ./Deployment/setup-azd-app-registration.ps1
    interactive: true
  postprovision:
    shell: pwsh
    run: pwsh -NoProfile -File ./Deployment/apply-custom-domain.ps1; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; $resourceGroupName = azd env get-value resourceGroupName 2>&1; $azdExitCode = $LASTEXITCODE; $resourceGroupName = (($resourceGroupName | Out-String) -split 'Update available:', 2)[0].Trim(); if ($azdExitCode -ne 0 -or [string]::IsNullOrWhiteSpace($resourceGroupName) -or $resourceGroupName -match '^ERROR') { Write-Error 'Missing resourceGroupName in azd environment.'; exit 1 }; pwsh -NoProfile -File ./Deployment/assign-mi-rbac.ps1 -ResourceGroup $resourceGroupName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    interactive: false
  postdeploy:
    shell: pwsh
    run: ./Deployment/update-app-registration-redirect-uri.ps1
    interactive: false
